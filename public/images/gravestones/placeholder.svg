<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9a96"/>
      <stop offset="0.5" stop-color="#7d7d79"/>
      <stop offset="1" stop-color="#5e5e5a"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <path d="M60 790 V260 A240 240 0 0 1 540 260 V790 Z" fill="url(#stone)" filter="url(#grain)" stroke="#4a4a46" stroke-width="6"/>
  <rect x="20" y="740" width="560" height="56" rx="6" fill="#55554f" filter="url(#grain)"/>
</svg>
